name: docker-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/erp/**"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/erp
          file: apps/erp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-lightsail:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pull image on Lightsail and restart
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/ls.pem
          printf '%s\n' "$SSH_KEY" > /tmp/ls.pem
          ssh -i /tmp/ls.pem -o StrictHostKeyChecking=accept-new "ec2-user@${HOST}" \
            GHCR_TOKEN="$GHCR_TOKEN" GHCR_USER="$GHCR_USER" IMAGE="$IMAGE" bash -s <<'REMOTE'
          set -euo pipefail
          echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
          sudo docker pull "$IMAGE"
          sudo docker rm -f campus-erp || true
          sudo docker run -d --name campus-erp --restart unless-stopped \
            --env-file /opt/campus-erp/app.env \
            -p 80:3000 \
            -v /opt/campus-erp/uploads:/app/uploads \
            "$IMAGE"
          sudo docker logout ghcr.io || true
          sudo docker ps --filter name=campus-erp
          REMOTE
          rm -f /tmp/ls.pem
