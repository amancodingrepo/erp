name: docker-image

# Runs only after the ci workflow succeeds on a push to main.
# A pull request can pass ci and still never deploy.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-lightsail
  cancel-in-progress: false

jobs:
  build:
    name: build-image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: meta
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}:$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/erp/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-lightsail:
    name: deploy-and-health-check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Pull the tested image, switch the container, roll back if unhealthy
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.build.outputs.image }}
          # Repository variable (Settings > Secrets and variables > Actions > Variables), for
          # example erp.schoolworld.online. Set it to serve the site over HTTPS; empty means HTTP.
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
        run: |
          set -euo pipefail
          # It goes into a remote shell command below, so only a plain hostname is allowed.
          if [ -n "$PUBLIC_DOMAIN" ] && ! printf '%s' "$PUBLIC_DOMAIN" | grep -Eq '^[a-z0-9.-]+$'; then
            echo "PUBLIC_DOMAIN must be a plain lowercase hostname"; exit 1
          fi
          install -m 600 /dev/null /tmp/ls.pem
          printf '%s\n' "$SSH_KEY" > /tmp/ls.pem
          ssh -i /tmp/ls.pem -o StrictHostKeyChecking=accept-new "ec2-user@${HOST}" \
            "IMAGE='$IMAGE' GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' PUBLIC_DOMAIN='$PUBLIC_DOMAIN' bash -s" \
            < deploy/lightsail/promote.sh
          rm -f /tmp/ls.pem

      - name: Point latest at the healthy image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - run: >-
          docker buildx imagetools create
          -t ghcr.io/${{ github.repository }}:latest
          ${{ needs.build.outputs.image }}
