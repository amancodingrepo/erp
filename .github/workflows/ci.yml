name: ci

on:
  push:
    branches: [main]
    paths:
      - "apps/erp/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/erp/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/erp

jobs:
  unit:
    name: unit-and-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/erp/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run test:unit

  integration:
    name: integration-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp
      AUTH_SECRET: ci-auth-secret-not-for-production-32ch
      FIELD_ENCRYPTION_KEY: ci-field-key-not-for-production-32ch
      SEED_ADMIN_PASSWORD: Admin@12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/erp/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx vitest run src/test

  deploy:
    name: railway-up
    needs: [unit, integration]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: railway-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        working-directory: .
        run: npm i -g @railway/cli
      - name: Deploy web
        working-directory: apps/erp
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Set GitHub secret RAILWAY_TOKEN to a Railway project token for this environment"
            exit 1
          fi
          railway up --ci --service web \
            --project 5839f917-2aeb-49d3-a6ef-3954e23062e6 \
            --environment 31e38090-d678-482a-acae-448a8018a54b \
            -m "github ${GITHUB_SHA}"
