name: erp
on:
  push:
    paths:
      - "apps/erp/**"
      - ".github/workflows/erp.yml"
  pull_request:
    paths:
      - "apps/erp/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/erp/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx vitest run src/lib src/lib/catalog/catalog.test.ts src/test/remaining-modules.test.ts
